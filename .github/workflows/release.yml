name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      docker_version: ${{ steps.version.outputs.docker_version }}
      minor: ${{ steps.version.outputs.minor }}
      stable: ${{ steps.version.outputs.stable }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_policy.py "$RELEASE_TAG"

  build:
    needs: [verify, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          CGO_ENABLED=0 go build -ldflags "-X github.com/irevolve/bear/commands.Version=${VERSION}" -o "bear-${GOOS}-${GOARCH}${ext}" .
      - uses: actions/upload-artifact@v4
        with:
          name: bear-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bear-*

  release:
    needs: [verify, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bear-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.stable }}

  docker:
    needs: [verify, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ""
            alias: latest
            prerelease_prefix: scratch-
          - dockerfile: Dockerfile.alpine
            suffix: "-alpine"
            alias: alpine
            prerelease_prefix: alpine-
          - dockerfile: Dockerfile.debian
            suffix: "-debian"
            alias: debian
            prerelease_prefix: debian-
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.prerelease == 'true' && matrix.prerelease_prefix || '' }}${{ needs.version.outputs.docker_version }}${{ matrix.suffix }}
            type=raw,value=${{ needs.version.outputs.minor }}${{ matrix.suffix }},enable=${{ needs.version.outputs.stable == 'true' }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ needs.version.outputs.stable == 'true' }}
            type=raw,value=${{ matrix.alias }},enable=${{ needs.version.outputs.stable == 'true' && matrix.suffix != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.alias }}
          cache-to: type=gha,mode=max,scope=${{ matrix.alias }}
